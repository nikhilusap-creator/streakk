<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streakk">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>Streakk</title>
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0eff8;--muted:#7b7a8e;--dim:#3d3c4e;--green:#00d4a0;--green-bg:rgba(0,212,160,0.1);--red:#ff5c6b;--red-bg:rgba(255,92,107,0.1);--blue:#6c8fff;--blue-bg:rgba(108,143,255,0.1);--amber:#ffb547;--amber-bg:rgba(255,181,71,0.1);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Syne,sans-serif;overflow-x:hidden}
.app{max-width:680px;margin:0 auto;padding-bottom:90px;min-height:100vh}
.hdr{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;border-bottom:1px solid var(--border)}
.hdr-l{display:flex;align-items:center;gap:10px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#upd{font-size:11px;font-family:DM Mono,monospace;color:var(--muted)}
.add-wrap{padding:14px 20px 0}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:11px 14px;font-size:14px;font-family:DM Mono,monospace;color:var(--text);letter-spacing:.05em;outline:none;transition:border-color .15s}
.add-row input:focus{border-color:var(--blue)}
.add-row input::placeholder{color:var(--dim)}
.add-btn{padding:11px 18px;background:var(--blue-bg);border:1px solid var(--blue);border-radius:12px;color:var(--blue);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.add-btn:active{transform:scale(.96)}
.wl{padding:12px 20px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.wl::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:30px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-family:DM Mono,monospace;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.chip.active{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.cpct{font-size:11px}.cpct.up{color:var(--green)}.cpct.down{color:var(--red)}
.crm{font-size:11px;color:var(--dim);margin-left:1px;padding:0 2px}.crm:hover{color:var(--red)}
.cnt{padding:0 20px}
.phero{padding:22px 0 18px;border-bottom:1px solid var(--border)}
.pname{font-size:12px;font-family:DM Mono,monospace;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.prow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pbig{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1}
.pchg{font-size:15px;font-family:DM Mono,monospace;padding:4px 10px;border-radius:8px}
.pchg.up{color:var(--green);background:var(--green-bg)}.pchg.down{color:var(--red);background:var(--red-bg)}
.stale-note{font-size:11px;font-family:DM Mono,monospace;color:var(--amber);margin-top:6px}
.streak-wrap{padding:20px 0;border-bottom:1px solid var(--border)}
.slbl{font-size:11px;font-family:DM Mono,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
.shero{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.sbadge{padding:10px 18px;border-radius:14px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.sbadge.up{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,212,160,.2)}
.sbadge.down{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,92,107,.2)}
.sbadge.flat{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.smeta{font-size:13px;color:var(--muted);line-height:1.8}
.smeta strong{color:var(--text);font-weight:600}
.ssig{margin-top:4px;font-size:12px;padding:3px 9px;border-radius:6px;display:inline-block}
.sig-sell{background:var(--red-bg);color:var(--red)}.sig-buy{background:var(--green-bg);color:var(--green)}.sig-watch{background:var(--amber-bg);color:var(--amber)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.dot.up{background:var(--green-bg);color:var(--green)}.dot.down{background:var(--red-bg);color:var(--red)}
.dot.flat{background:var(--surface2);color:var(--dim)}.dot.cur{outline:2px solid currentColor;outline-offset:1px}
.prox-wrap{padding:20px 0;border-bottom:1px solid var(--border)}
.prox-bar-track{height:8px;border-radius:4px;background:var(--surface2);position:relative;margin:12px 0 6px}
.prox-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));width:100%;position:absolute;left:0;top:0;opacity:.4}
.prox-needle{width:3px;height:18px;border-radius:2px;background:var(--text);box-shadow:0 0 6px rgba(255,255,255,.4);position:absolute;top:-5px;transform:translateX(-50%)}
.prox-labels{display:flex;justify-content:space-between;font-size:11px;font-family:DM Mono,monospace;color:var(--muted)}
.prox-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.prox-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.prox-stat-lbl{font-size:11px;font-family:DM Mono,monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.prox-stat-val{font-size:20px;font-weight:700;letter-spacing:-.02em}
.prox-stat-sub{font-size:12px;font-family:DM Mono,monospace;margin-top:3px;color:var(--muted)}
.prox-signal{margin-top:12px;font-size:12px;padding:6px 12px;border-radius:8px;font-family:DM Mono,monospace;display:inline-block}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px 0;border-bottom:1px solid var(--border)}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.mlbl{font-size:11px;font-family:DM Mono,monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.mval{font-size:22px;font-weight:700;letter-spacing:-.02em}
.msub{font-size:12px;margin-top:4px;font-family:DM Mono,monospace}
.mval.up,.msub.up{color:var(--green)}.mval.down,.msub.down{color:var(--red)}.mval.blue{color:var(--blue)}.msub.neu{color:var(--muted)}
.rev-wrap{padding:20px 0;border-bottom:1px solid var(--border)}
.rev-list{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
.rtime{font-family:DM Mono,monospace;font-size:13px;color:var(--muted);min-width:58px}
.rprice{font-family:DM Mono,monospace;font-size:14px;font-weight:500;margin-left:auto}
.ritem.up .rprice{color:var(--green)}.ritem.down .rprice{color:var(--red)}
.no-rev{font-size:13px;color:var(--dim);font-family:DM Mono,monospace;padding:8px 0}
.chart-wrap{padding:20px 0}
.rtabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtab{flex-shrink:0;padding:6px 14px;border-radius:8px;font-size:12px;font-family:DM Mono,monospace;font-weight:500;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s}
.rtab.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.cwrap{position:relative;width:100%;height:240px;margin-bottom:16px}
.cgrid{display:grid;grid-template-columns:1fr;gap:10px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.ctitle{font-size:10px;font-family:DM Mono,monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.cswrap{position:relative;height:110px}
.stmsg{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:14px;line-height:1.6}
.spin{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{margin:20px 0;padding:16px;border-radius:14px;border:1px solid rgba(255,92,107,.25);background:rgba(255,92,107,.07);font-size:13px;font-family:DM Mono,monospace;color:var(--red);line-height:1.9}
.bot{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;padding:12px 20px 20px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px}
.bot button{flex:1;padding:13px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.bot button:active{transform:scale(.97)}
</style>
</head>

<script>
(function(){

  {label:"1D",range:"1d",  interval:"5m",  fmt:"time"},
  {label:"1W",range:"5d",  interval:"30m", fmt:"date"},
  {label:"1M",range:"1mo", interval:"1d",  fmt:"date"},
  {label:"3M",range:"3mo", interval:"1d",  fmt:"date"},
  {label:"1Y",range:"1y",  interval:"1wk", fmt:"date"},

var watchlist=[], activeTicker=null, activeRI=2;

try{watchlist=JSON.parse(localStorage.getItem("sv_wl")||"[]");}catch(e){}
if(!watchlist.length) watchlist=["AAPL","MSFT","NVDA","SPY"];

function saveWL(){try{localStorage.setItem("sv_wl",JSON.stringify(watchlist));}catch(e){}}

function setStreakDays(n){
  STREAK_DAYS=Math.max(5,Math.min(100,parseInt(n)||30));
  localStorage.setItem("streak_days",STREAK_DAYS);
  if(activeTicker) loadTicker(activeTicker,activeRI);
}

function renderWL(){
  var el=document.getElementById("wl");
  if(!el) return;
  var html="";
  for(var i=0;i<watchlist.length;i++){
    var t=watchlist[i];
    var p=chipPcts[t];
    var ps=(p!=null)?('<span class="cpct '+(p>=0?"up":"down")+'">'+(p>=0?"+":"")+p.toFixed(1)+"%</span>"):"";
    html+='<span class="chip '+(t===activeTicker?"active":"")+'" onclick="sel(\''+t+'\')">'+t+ps+'<span class="crm" onclick="event.stopPropagation();rm(\''+t+'\')">&#x2715;</span></span>';
  }
  el.innerHTML=html;
}

function addTicker(){
  var inp=document.getElementById("ti");
  var t=inp.value.trim().toUpperCase();
  inp.value="";
  if(!t) return;
  for(var i=0;i<watchlist.length;i++){if(watchlist[i]===t)return;}
  watchlist.push(t);
  saveWL();
  sel(t);
}
function rm(t){
  var newWL=[];
  for(var i=0;i<watchlist.length;i++){if(watchlist[i]!==t)newWL.push(watchlist[i]);}
  watchlist=newWL;
  delete chipPcts[t];
  saveWL();
  if(activeTicker===t) activeTicker=watchlist.length?watchlist[0]:null;
  renderWL();
  if(activeTicker) loadTicker(activeTicker,activeRI);
  else document.getElementById("cnt").innerHTML='<div class="stmsg">Add a ticker above.</div>';
}
function sel(t){activeTicker=t;renderWL();loadTicker(t,activeRI);}
function refresh(){if(activeTicker)loadTicker(activeTicker,activeRI);}
function selR(i){activeRI=i;if(activeTicker)loadTicker(activeTicker,i);}

window.addTicker=addTicker;
window.refresh=refresh;
window.sel=sel;
window.rm=rm;
window.selR=selR;
window.setStreakDays=setStreakDays;

function fetchWT(url,ms){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error("Timeout"));},ms);
    fetch(url,{cache:"no-store"}).then(function(r){clearTimeout(t);res(r);}).catch(function(e){clearTimeout(t);rej(e);});
  });
}
function parseYahoo(d){
  var result=d&&d.chart&&d.chart.result&&d.chart.result[0];
  if(!result||!result.timestamp) return null;
  var q=result.indicators.quote[0];
  var ts=result.timestamp;
  var entries=[];
  for(var i=0;i<ts.length;i++){
    if(q.close[i]==null) continue;
    entries.push({
      t:ts[i]*1000,
      o:q.open[i]||q.close[i],
      h:q.high[i]||q.close[i],
      l:q.low[i]||q.close[i],
      c:q.close[i],
      v:q.volume[i]||0
    });
  }
  if(!entries.length) return null;
  entries._meta=result.meta||{};
  return entries;
}
async function fetchSeries(ticker,ri){
  var rng=RANGES[ri];
  var bust=Date.now();
  var qs="?range="+rng.range+"&interval="+rng.interval+"&includePrePost=false&_="+bust;
  var base="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(ticker)+"?range="+rng.range+"&interval="+rng.interval+"&includePrePost=false";
  var urls=[
    YAHOO+encodeURIComponent(ticker)+qs,
    YAHOO2+encodeURIComponent(ticker)+qs,
    PROXY1+encodeURIComponent(base),
    PROXY2+encodeURIComponent(base)
  ];
  var errs=[];
  for(var i=0;i<urls.length;i++){
    try{
      var r=await fetchWT(urls[i],12000);
      if(!r.ok){errs.push("HTTP "+r.status);continue;}
      var d=await r.json();
      var entries=parseYahoo(d);
      if(entries) return entries;
      errs.push("empty");
    }catch(e){errs.push(e.message||"error");}
  }
  throw new Error("All sources failed: "+errs.join(" | "));
}
function calcRSI(cl,p){
  p=p||14;
  if(cl.length<p+1) return cl.map(function(){return 50;});
  var gA=0,lA=0,i,d,g,l;
  for(i=1;i<=p;i++){d=cl[i]-cl[i-1];if(d>0)gA+=d;else lA-=d;}
  gA/=p;lA/=p;
  var rsi=[];
  for(i=0;i<p;i++) rsi.push(null);
  rsi.push(lA===0?100:100-100/(1+gA/lA));
  for(i=p+1;i<cl.length;i++){
    d=cl[i]-cl[i-1];g=d>0?d:0;l=d<0?-d:0;
    gA=(gA*(p-1)+g)/p;lA=(lA*(p-1)+l)/p;
    rsi.push(lA===0?100:100-100/(1+gA/lA));
  }
  return rsi;
}
function calcStreak(cl){
  if(cl.length<2) return {count:0,dir:"flat",days:[]};
  var dirs=[],i;
  for(i=1;i<cl.length;i++) dirs.push(cl[i]>cl[i-1]?"up":cl[i]<cl[i-1]?"down":"flat");
  var last=dirs[dirs.length-1],n=0;
  for(i=dirs.length-1;i>=0;i--){if(dirs[i]===last)n++;else break;}
  return{count:n,dir:last,days:dirs.slice(-STREAK_DAYS)};
}
function calcReversals(entries){
  var rev=[],i,p,c,d;
  for(i=2;i<entries.length;i++){
    p=entries[i-1].c-entries[i-2].c;
    c=entries[i].c-entries[i-1].c;
    if((p>0&&c<0)||(p<0&&c>0)){
      d=new Date(entries[i].t);
      rev.push({time:d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),type:c>0?"up":"down",price:entries[i].c});
    }
  }
  return rev.slice(-6);
}
function getSignal(sk,rsi){
  if(sk.dir==="up"  &&sk.count>=4&&rsi>70) return{cls:"sig-sell",txt:"&#9888; Sell signal &mdash; long up streak + overbought RSI"};
  if(sk.dir==="down"&&sk.count>=4&&rsi<30) return{cls:"sig-buy", txt:"&#9889; Buy signal &mdash; long down streak + oversold RSI"};
  if(sk.dir==="up"  &&sk.count>=3)         return{cls:"sig-watch",txt:"&#128065; Watch &mdash; extended upward streak"};
  if(sk.dir==="down"&&sk.count>=3)         return{cls:"sig-watch",txt:"&#128065; Watch &mdash; extended downward streak"};
  return null;
}
function destroyC(){
  [chartMain,chartVol,chartRSI].forEach(function(c){if(c)c.destroy();});
  chartMain=chartVol=chartRSI=null;
}
async function loadTicker(ticker,ri){
  activeRI=ri;
  destroyC();
  document.getElementById("cnt").innerHTML='<div class="stmsg"><div class="spin"></div><span>Loading '+ticker+'...</span></div>';
  renderWL();
  var entries;
  try{entries=await fetchSeries(ticker,ri);}
  catch(e){
    document.getElementById("cnt").innerHTML='<div class="errbox"><strong>Could not load '+ticker+'</strong><br><br>'+e.message+'</div>';
    return;
  }
  // For streak dots we need enough bars — if STREAK_DAYS needs more data than
  // the current range provides, fetch a wider range just for the streak calculation.
  // 1D/1W give intraday bars (not daily), so always fetch daily for streak.
  // 1M gives ~21 bars, 3M gives ~63, 1Y gives ~52 weekly bars.
  var streakEntries=entries;
  var needDailyStreak=(ri<=1); // 1D or 1W use intraday — need separate daily fetch
  var needMoreBars=(STREAK_DAYS>21 && ri===2); // on 1M but want 30+ days
  if(needDailyStreak||needMoreBars){
    var streakRI=STREAK_DAYS<=21?2:STREAK_DAYS<=63?3:4; // 1M, 3M, or 1Y
    try{streakEntries=await fetchSeries(ticker,streakRI);}
    catch(e){streakEntries=entries;} // fallback to chart data
  }
  if(!entries.length){
    document.getElementById("cnt").innerHTML='<div class="stmsg">No data for this range.</div>';
    return;
  }
  var cl=entries.map(function(e){return e.c;});
  var vl=entries.map(function(e){return e.v;});
  var last=entries[entries.length-1];
  var prev=entries[entries.length-2];
  var price=last.c, prevClose=prev?prev.c:last.c;
  var change=price-prevClose, changePct=(change/prevClose)*100;
  var hiQ=last.h, loQ=last.l, lastVol=last.v||0;
  var avgVol=vl.reduce(function(a,b){return a+b;},0)/vl.length;
  var allH=entries.map(function(e){return e.h;}).filter(Boolean);
  var allL=entries.map(function(e){return e.l;}).filter(Boolean);
  var w52Hi=allH.length?Math.max.apply(null,allH):price;
  var w52Lo=allL.length?Math.min.apply(null,allL):price;
  var w52Rng=w52Hi-w52Lo;
  var w52Pos=w52Rng>0?((price-w52Lo)/w52Rng)*100:50;
  var pctFromHi=((price/w52Hi)-1)*100;
  var pctFromLo=((price/w52Lo)-1)*100;
  var proxSig="Mid-range",proxColor="var(--muted)",proxBg="var(--surface)",proxBdr="var(--border)";
  if(w52Pos>=90){proxSig="Near 52W HIGH &mdash; resistance zone";proxColor="var(--red)";proxBg="var(--red-bg)";proxBdr="rgba(255,92,107,.3)";}
  else if(w52Pos>=75){proxSig="Upper range &mdash; extended territory";proxColor="var(--amber)";proxBg="var(--amber-bg)";proxBdr="rgba(255,181,71,.3)";}
  else if(w52Pos<=10){proxSig="Near 52W LOW &mdash; potential support";proxColor="var(--green)";proxBg="var(--green-bg)";proxBdr="rgba(0,212,160,.3)";}
  else if(w52Pos<=25){proxSig="Lower range &mdash; watch for bottoming";proxColor="var(--amber)";proxBg="var(--amber-bg)";proxBdr="rgba(255,181,71,.3)";}
  // Use streakEntries (may be wider range) for the dots, chart entries for price/volume
  var streakCl=streakEntries.map(function(e){return e.c;});
  var sk=calcStreak(streakCl);
  var rsi=calcRSI(cl);
  var lastRSI=rsi.filter(function(v){return v!=null;}).pop()||50;
  var revs=ri===0?calcReversals(entries):[];
  var sig=getSignal(sk,lastRSI);
  chipPcts[ticker]=changePct;
  renderWL();
  var daysSince=(Date.now()-last.t)/864e5;
  var staleNote=daysSince>4?'<div class="stale-note">Data as of '+new Date(last.t).toLocaleDateString()+' &mdash; market may be closed</div>':"";
  document.getElementById("upd").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  var rng=RANGES[ri];
  var labels=entries.map(function(e){
    var d=new Date(e.t);
    if(rng.fmt==="time") return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    if(rng.fmt==="month") return d.toLocaleDateString([],{month:"short",year:"2-digit"});
    return d.toLocaleDateString([],{month:"short",day:"numeric"});
  });
  var rsiLbl="Neutral",rsiCls="blue";
  if(lastRSI>70){rsiLbl="Overbought";rsiCls="down";}
  else if(lastRSI<30){rsiLbl="Oversold";rsiCls="up";}
  var dotsH="";
  for(var di=0;di<sk.days.length;di++){
    var dv=sk.days[di];
    dotsH+='<div class="dot '+dv+(di===sk.days.length-1?" cur":"")+'">'+
      (dv==="up"?"&#9650;":dv==="down"?"&#9660;":"&mdash;")+"</div>";
  }
  var sigH=sig?'<div class="ssig '+sig.cls+'">'+sig.txt+"</div>":'<span style="font-size:12px;color:var(--dim)">No strong signal yet</span>';
  var revH="";
  if(revs.length){
    for(var ri2=0;ri2<revs.length;ri2++){
      var rv=revs[ri2];
      revH+='<div class="ritem '+rv.type+'"><span class="rtime">'+rv.time+'</span><span style="font-size:13px;color:var(--muted)">'+(rv.type==="up"?"&#9650; Bounce":"&#9660; Reversal")+'</span><span class="rprice">$'+rv.price.toFixed(2)+"</span></div>";
    }
  }else{revH='<div class="no-rev">No intraday reversals detected</div>';}
  var needlePct=Math.max(2,Math.min(98,w52Pos));
  var streakBtns="";
  var snVals=[10,20,30,50];
  for(var si=0;si<snVals.length;si++){
    var sn=snVals[si];
    var active=(STREAK_DAYS===sn);
    streakBtns+='<span onclick="setStreakDays('+sn+')" style="padding:5px 14px;border-radius:20px;font-size:12px;'+
      'font-family:DM Mono,monospace;cursor:pointer;user-select:none;'+
      'border:1px solid '+(active?"var(--green)":"var(--border2)")+";"+
      "background:"+(active?"var(--green-bg)":"var(--surface)")+";"+
      "color:"+(active?"var(--green)":"var(--muted)")+'">'+sn+"d</span>";
  }
  var rangeTabs="";
  for(var rti=0;rti<RANGES.length;rti++){
    rangeTabs+='<span class="rtab '+(rti===ri?"active":"")+'" onclick="selR('+rti+')">'+RANGES[rti].label+"</span>";
  }
  document.getElementById("cnt").innerHTML=
    '<div class="phero">'+
      '<div class="pname">'+ticker+"</div>"+
      '<div class="prow">'+
        '<span class="pbig">$'+price.toFixed(2)+"</span>"+
        '<span class="pchg '+(change>=0?"up":"down")+'">'+(change>=0?"+":"")+change.toFixed(2)+
        " ("+(changePct>=0?"+":"")+changePct.toFixed(2)+"%)</span>"+
      "</div>"+staleNote+
    "</div>"+
    '<div class="streak-wrap">'+
      '<div class="slbl">Streak History</div>'+
      '<div class="shero">'+
        '<div class="sbadge '+sk.dir+'">'+(sk.dir==="up"?"&#8593;":sk.dir==="down"?"&#8595;":"&mdash;")+
        " "+sk.count+" "+(sk.count===1?"day":"days")+"</div>"+
        '<div class="smeta"><strong>'+(sk.dir==="up"?"Rising":sk.dir==="down"?"Falling":"Flat")+"</strong> "+
        sk.count+" session"+(sk.count===1?"":"s")+" in a row<br>"+sigH+"</div>"+
      "</div>"+
      '<div class="dots">'+dotsH+"</div>"+
      '<div style="display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap">'+
        '<span style="font-size:11px;font-family:DM Mono,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Show</span>'+
        streakBtns+
      "</div>"+
    "</div>"+
    '<div class="prox-wrap">'+
      '<div class="slbl">52-Week Position</div>'+
      '<div class="prox-bar-track">'+
        '<div class="prox-bar-fill"></div>'+
        '<div class="prox-needle" style="left:'+needlePct+'%"></div>'+
      "</div>"+
      '<div class="prox-labels">'+
        '<span>52W Low<br><strong style="color:var(--text)">$'+w52Lo.toFixed(2)+"</strong></span>"+
        '<span style="text-align:center">Position<br><strong style="color:var(--text)">'+w52Pos.toFixed(0)+"%</strong></span>"+
        '<span style="text-align:right">52W High<br><strong style="color:var(--text)">$'+w52Hi.toFixed(2)+"</strong></span>"+
      "</div>"+
      '<div class="prox-stats">'+
        '<div class="prox-stat">'+
          '<div class="prox-stat-lbl">From 52W High</div>'+
          '<div class="prox-stat-val '+(pctFromHi>=-5?"down":"neu")+'">'+pctFromHi.toFixed(1)+"%</div>"+
          '<div class="prox-stat-sub">'+(pctFromHi>=-2?"At or near high":pctFromHi>=-10?"Close to high":"Well below high")+"</div>"+
        "</div>"+
        '<div class="prox-stat">'+
          '<div class="prox-stat-lbl">From 52W Low</div>'+
          '<div class="prox-stat-val '+(pctFromLo<=15?"up":"neu")+'">+'+pctFromLo.toFixed(1)+"%</div>"+
          '<div class="prox-stat-sub">'+(pctFromLo<=5?"Near the low":pctFromLo<=25?"Above the low":"Well above low")+"</div>"+
        "</div>"+
      "</div>"+
      '<div class="prox-signal" style="background:'+proxBg+";border:1px solid "+proxBdr+";color:"+proxColor+'">'+proxSig+"</div>"+
    "</div>"+
    '<div class="metrics">'+
      '<div class="mc"><div class="mlbl">RSI 14</div><div class="mval '+rsiCls+'">'+lastRSI.toFixed(1)+'</div><div class="msub '+rsiCls+'">'+rsiLbl+"</div></div>"+
      '<div class="mc"><div class="mlbl">Volume</div><div class="mval">'+(lastVol>=1e6?(lastVol/1e6).toFixed(2)+"M":(lastVol/1e3).toFixed(0)+"K")+'</div><div class="msub '+(lastVol>avgVol?"up":"down")+'">'+(lastVol>avgVol?"Above":"Below")+" avg ("+(avgVol/1e6).toFixed(1)+"M)</div></div>"+
      '<div class="mc"><div class="mlbl">Day High</div><div class="mval">$'+hiQ.toFixed(2)+'</div><div class="msub neu">Today</div></div>'+
      '<div class="mc"><div class="mlbl">Day Low</div><div class="mval">$'+loQ.toFixed(2)+'</div><div class="msub neu">Today</div></div>'+
    "</div>"+
    (ri===0?'<div class="rev-wrap"><div class="slbl">Intraday Reversals</div><div class="rev-list">'+revH+"</div></div>":"")+
    '<div class="chart-wrap">'+
      '<div class="slbl">Price Chart</div>'+
      '<div class="rtabs">'+rangeTabs+"</div>"+
      '<div class="cwrap"><canvas id="cM"></canvas></div>'+
      '<div class="cgrid">'+
        '<div class="ccard"><div class="ctitle">Volume</div><div class="cswrap"><canvas id="cV"></canvas></div></div>'+
        '<div class="ccard"><div class="ctitle">RSI 14 &middot; OB&gt;70 OS&lt;30</div><div class="cswrap"><canvas id="cR"></canvas></div></div>'+
      "</div>"+
    "</div>";
  var uC="#00d4a0",dC="#ff5c6b",bC="#6c8fff",pC=change>=0?uC:dC;
  var gO={color:"rgba(255,255,255,.05)",border:{display:false}};
  var tO={color:"#7b7a8e",font:{size:10,family:"DM Mono"}};
  var ttO={backgroundColor:"#1c1c26",borderColor:"rgba(255,255,255,.1)",borderWidth:1,titleColor:"#7b7a8e",bodyColor:"#f0eff8"};
  chartMain=new Chart(document.getElementById("cM"),{
    type:"line",
    data:{labels:labels,datasets:[{data:cl,borderColor:pC,borderWidth:2,pointRadius:0,tension:0.3,fill:true,
      backgroundColor:change>=0?"rgba(0,212,160,.07)":"rgba(255,92,107,.07)"}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false},tooltip:Object.assign({},ttO,{callbacks:{label:function(c){return "$"+c.parsed.y.toFixed(2);}}})},
      scales:{x:{ticks:Object.assign({},tO,{maxTicksLimit:7}),grid:gO,border:{display:false}},
              y:{ticks:Object.assign({},tO,{callback:function(v){return "$"+v.toFixed(0);}}),grid:gO,border:{display:false}}}}
  });
  var volC=cl.map(function(c,i){return i===0?uC:c>=cl[i-1]?uC:dC;});
  chartVol=new Chart(document.getElementById("cV"),{
    type:"bar",
    data:{labels:labels,datasets:[{data:vl,backgroundColor:volC,borderWidth:0,borderRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{display:false},y:{ticks:Object.assign({},tO,{maxTicksLimit:3,
        callback:function(v){return v>=1e6?(v/1e6).toFixed(1)+"M":(v/1e3).toFixed(0)+"K";}}),grid:gO,border:{display:false}}}}
  });
  chartRSI=new Chart(document.getElementById("cR"),{
    type:"line",
    data:{labels:labels,datasets:[
      {data:rsi,borderColor:bC,borderWidth:1.5,pointRadius:0,tension:0.2},
      {data:rsi.map(function(){return 70;}),borderColor:dC,borderWidth:1,borderDash:[4,3],pointRadius:0},
      {data:rsi.map(function(){return 30;}),borderColor:uC,borderWidth:1,borderDash:[4,3],pointRadius:0}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{display:false},y:{min:0,max:100,ticks:Object.assign({},tO,{stepSize:25}),grid:gO,border:{display:false}}}}
  });
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js",{scope:"./"})
    .then(function(){console.log("[Streakk] SW registered");})
    .catch(function(e){console.warn("[Streakk] SW:",e);});
}
renderWL();
if(activeTicker) loadTicker(activeTicker,activeRI);
})();
