<style>
:root {
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0eff8;--muted:#7b7a8e;--dim:#3d3c4e;
  --green:#00d4a0;--green-bg:rgba(0,212,160,0.1);
  --red:#ff5c6b;--red-bg:rgba(255,92,107,0.1);
  --blue:#6c8fff;--blue-bg:rgba(108,143,255,0.1);
  --amber:#ffb547;--amber-bg:rgba(255,181,71,0.1);
  --fd:'Syne',sans-serif;--fm:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fd);overflow-x:hidden}
.app{max-width:680px;margin:0 auto;padding-bottom:90px;min-height:100vh}

/* Header */
.hdr{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;border-bottom:1px solid var(--border)}
.hdr-l{display:flex;align-items:center;gap:10px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
#upd{font-size:11px;font-family:var(--fm);color:var(--muted)}

/* API Key panel */
.key-panel{margin:16px 20px;padding:16px;background:var(--amber-bg);border:1px solid rgba(255,181,71,.25);border-radius:16px}
.key-panel p{font-size:13px;color:var(--amber);line-height:1.7;margin-bottom:12px}
.key-panel a{color:var(--blue);text-decoration:none}
.key-row{display:flex;gap:8px}
.key-row input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;font-size:13px;font-family:var(--fm);color:var(--text);outline:none;min-width:0}
.key-row input:focus{border-color:var(--amber)}
.key-row button{padding:10px 16px;background:var(--amber-bg);border:1px solid var(--amber);border-radius:10px;color:var(--amber);font-family:var(--fd);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.key-row button:active{transform:scale(.96)}
.key-status{margin-top:8px;font-size:12px;font-family:var(--fm)}
.key-status.ok{color:var(--green)}
.key-status.err{color:var(--red)}

/* Add row */
.add-wrap{padding:14px 20px 0}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:11px 14px;font-size:14px;font-family:var(--fm);color:var(--text);letter-spacing:.05em;outline:none;transition:border-color .15s}
.add-row input:focus{border-color:var(--blue)}
.add-row input::placeholder{color:var(--dim)}
.add-btn{padding:11px 18px;background:var(--blue-bg);border:1px solid var(--blue);border-radius:12px;color:var(--blue);font-family:var(--fd);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.add-btn:hover{background:rgba(108,143,255,.2)}
.add-btn:active{transform:scale(.96)}

/* Watchlist */
.wl{padding:12px 20px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.wl::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:30px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-family:var(--fm);font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.active{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.cpct{font-size:11px}.cpct.up{color:var(--green)}.cpct.down{color:var(--red)}
.crm{font-size:11px;color:var(--dim);margin-left:1px;padding:0 2px}.crm:hover{color:var(--red)}

/* Content */
.cnt{padding:0 20px}

/* Price hero */
.phero{padding:22px 0 18px;border-bottom:1px solid var(--border)}
.pname{font-size:12px;font-family:var(--fm);color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.prow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pbig{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1}
.pchg{font-size:15px;font-family:var(--fm);padding:4px 10px;border-radius:8px}
.pchg.up{color:var(--green);background:var(--green-bg)}
.pchg.down{color:var(--red);background:var(--red-bg)}

/* Streak */
.streak-wrap{padding:20px 0;border-bottom:1px solid var(--border)}
.slbl{font-size:11px;font-family:var(--fm);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
.shero{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.sbadge{padding:10px 18px;border-radius:14px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.sbadge.up{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,212,160,.2)}
.sbadge.down{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,92,107,.2)}
.sbadge.flat{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.smeta{font-size:13px;color:var(--muted);line-height:1.8}
.smeta strong{color:var(--text);font-weight:600}
.ssig{margin-top:4px;font-size:12px;padding:3px 9px;border-radius:6px;display:inline-block}
.sig-sell{background:var(--red-bg);color:var(--red)}
.sig-buy{background:var(--green-bg);color:var(--green)}
.sig-watch{background:var(--amber-bg);color:var(--amber)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.dot.up{background:var(--green-bg);color:var(--green)}
.dot.down{background:var(--red-bg);color:var(--red)}
.dot.flat{background:var(--surface2);color:var(--dim)}
.dot.cur{outline:2px solid currentColor;outline-offset:1px}

/* Metrics */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px 0;border-bottom:1px solid var(--border)}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.mlbl{font-size:11px;font-family:var(--fm);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.mval{font-size:22px;font-weight:700;letter-spacing:-.02em}
.msub{font-size:12px;margin-top:4px;font-family:var(--fm)}
.mval.up,.msub.up{color:var(--green)}.mval.down,.msub.down{color:var(--red)}
.mval.blue{color:var(--blue)}.msub.neu{color:var(--muted)}

/* Reversals */
.rev-wrap{padding:20px 0;border-bottom:1px solid var(--border)}
.rev-list{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
.rtime{font-family:var(--fm);font-size:13px;color:var(--muted);min-width:58px}
.rprice{font-family:var(--fm);font-size:14px;font-weight:500;margin-left:auto}
.ritem.up .rprice{color:var(--green)}.ritem.down .rprice{color:var(--red)}
.no-rev{font-size:13px;color:var(--dim);font-family:var(--fm);padding:8px 0}

/* Charts */
.chart-wrap{padding:20px 0}
.rtabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtab{flex-shrink:0;padding:6px 14px;border-radius:8px;font-size:12px;font-family:var(--fm);font-weight:500;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s}
.rtab:hover{border-color:var(--border2);color:var(--text)}
.rtab.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.cwrap{position:relative;width:100%;height:240px;margin-bottom:16px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.ctitle{font-size:10px;font-family:var(--fm);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.cswrap{position:relative;height:90px}

/* States */
.stmsg{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:14px;line-height:1.6}
.spin{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{margin:20px 0;padding:16px;border-radius:14px;border:1px solid rgba(255,92,107,.25);background:rgba(255,92,107,.07);font-size:13px;font-family:var(--fm);color:var(--red);line-height:1.9}

/* Bottom bar */
.bot{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;padding:12px 20px 20px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px}
.bot button{flex:1;padding:13px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;color:var(--text);font-family:var(--fd);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.bot button:hover{background:var(--surface2)}
.bot button:active{transform:scale(.97)}
.bot .smbtn{flex:0;padding:13px 14px;font-size:12px;font-family:var(--fm);color:var(--muted);border-color:var(--border)}
</style>

  const mBlob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
  const mUrl  = URL.createObjectURL(mBlob);
  const mLink = document.createElement("link");

  document.head.appendChild(mLink);

  // Register service worker that serves the icon files by intercepting fetch
  if ("serviceWorker" in navigator) {
    // Write SW script as a blob
    const swScript = `
const ICON192 = "${ICON192}";
const ICON512 = "${ICON512}";
function b64ToBytes(b64) {
  const bin = atob(b64.split(",")[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
self.addEventListener("fetch", e => {
  const url = e.request.url;
  if (url.endsWith("icon-192.png")) {
    e.respondWith(new Response(b64ToBytes(ICON192), {headers:{"Content-Type":"image/png"}}));
  } else if (url.endsWith("icon-512.png")) {
    e.respondWith(new Response(b64ToBytes(ICON512), {headers:{"Content-Type":"image/png"}}));
  }
});
`;
    const swBlob = new Blob([swScript], {type:"application/javascript"});
    const swUrl  = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl, {scope: "./"}
    ).then(() => console.log("SW registered")
    ).catch(e  => console.log("SW failed:", e));
  }

  try{localStorage.setItem("av_key",v);}catch(e){}
  document.getElementById("kpanel").style.display="none";
  renderWL(); if(activeTicker) loadTicker(activeTicker,activeRI);
}
function resetKey(){
  document.getElementById("kpanel").style.display="block";
  document.getElementById("ki").value="";
  apiKey=""; try{localStorage.removeItem("av_key");}catch(e){}
}
function setKS(msg,cls){ const el=document.getElementById("kstatus"); el.textContent=msg; el.className="key-status "+cls; }
function saveWL(){ try{localStorage.setItem("sv_wl",JSON.stringify(watchlist));}catch(e){} }

function renderWL(){
  document.getElementById("wl").innerHTML=watchlist.map(t=>{
    const p=chipPcts[t];
    const ps=p!=null?`<span class="cpct ${p>=0?'up':'down'}">${p>=0?'+':''}${p.toFixed(1)}%</span>`:'';
    return `<span class="chip ${t===activeTicker?'active':''}" onclick="sel('${t}')">${t}${ps}<span class="crm" onclick="event.stopPropagation();rm('${t}')">✕</span></span>`;
  }).join('');
}
function addTicker(){
  const i=document.getElementById("ti"),t=i.value.trim().toUpperCase();i.value="";
  if(!t||watchlist.includes(t))return;
  watchlist.push(t);saveWL();sel(t);
}
function rm(t){
  watchlist=watchlist.filter(x=>x!==t);delete chipPcts[t];saveWL();
  if(activeTicker===t)activeTicker=watchlist[0]||null;
  renderWL();
  if(activeTicker)loadTicker(activeTicker,activeRI);
  else document.getElementById("cnt").innerHTML='<div class="stmsg">Add a ticker above.</div>';
}
function sel(t){activeTicker=t;renderWL();loadTicker(t,activeRI);}
function refresh(){if(activeTicker&&apiKey)loadTicker(activeTicker,activeRI);}
function selR(i){activeRI=i;if(activeTicker)loadTicker(activeTicker,i);}
document.getElementById("ti").addEventListener("keydown",e=>{if(e.key==="Enter")addTicker();});

function fetchWithTimeout(url, ms){
  return new Promise((resolve,reject)=>{
    const t=setTimeout(()=>reject(new Error("Request timed out — check your internet connection")),ms);
    fetch(url).then(r=>{clearTimeout(t);resolve(r);}).catch(e=>{clearTimeout(t);reject(e);});
  });
}

async function avFetch(params){
  const url=AV+"?"+new URLSearchParams({...params,apikey:apiKey,datatype:"json"});
  const r=await fetchWithTimeout(url,12000);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  if(d["Note"])throw new Error("Rate limit hit — Alpha Vantage free tier allows 25 calls/day. Wait until tomorrow or upgrade.");
  if(d["Information"])throw new Error("API limit reached: "+d["Information"]);
  if(d["Error Message"])throw new Error("Invalid ticker symbol: "+d["Error Message"]);
  return d;
}

async function fetchSeries(ticker, ri){
  const rng=RANGES[ri];
  const params={function:rng.fn, symbol:ticker};
  if(rng.iv) params.interval=rng.iv;
  const d=await avFetch(params);
  const raw=d[rng.key];
  if(!raw)throw new Error("No data returned for "+ticker+". Check the ticker symbol.");
  // Convert to sorted arrays, trim to range
  const cutoff=Date.now()-rng.days*864e5;
  const entries=Object.entries(raw)
    .map(([k,v])=>({t:new Date(k).getTime(),o:+v["1. open"],h:+v["2. high"],l:+v["3. low"],c:+v["4. close"],v:+v["5. volume"]}))
    .filter(e=>e.t>=cutoff)
    .sort((a,b)=>a.t-b.t);
  if(!entries.length)throw new Error("No data in selected range for "+ticker);
  return entries;
}

async function fetchQuote(ticker){
  const d=await avFetch({function:"GLOBAL_QUOTE",symbol:ticker});
  const q=d["Global Quote"];
  if(!q||!q["05. price"])return null;
  return {
    price:+q["05. price"],
    prev:+q["08. previous close"],
    change:+q["09. change"],
    changePct:parseFloat(q["10. change percent"]),
    high:+q["03. high"],
    low:+q["04. low"],
    vol:+q["06. volume"]
  };
}

// Indicators
function calcRSI(cl,p=14){
  if(cl.length<p+1)return cl.map(()=>50);
  let gA=0,lA=0;
  for(let i=1;i<=p;i++){const d=cl[i]-cl[i-1];d>0?gA+=d:lA-=d;}
  gA/=p;lA/=p;
  const r=[...Array(p).fill(null)];
  r.push(lA===0?100:100-100/(1+gA/lA));
  for(let i=p+1;i<cl.length;i++){
    const d=cl[i]-cl[i-1],g=d>0?d:0,l=d<0?-d:0;
    gA=(gA*(p-1)+g)/p;lA=(lA*(p-1)+l)/p;
    r.push(lA===0?100:100-100/(1+gA/lA));
  }
  return r;
}

function streak(cl){
  if(cl.length<2)return{count:0,dir:'flat',days:[]};
  const dirs=cl.slice(1).map((c,i)=>c>cl[i]?'up':c<cl[i]?'down':'flat');
  const last=dirs[dirs.length-1];let n=0;
  for(let i=dirs.length-1;i>=0;i--){if(dirs[i]===last)n++;else break;}
  return{count:n,dir:last,days:dirs.slice(-20)};
}

function reversals(entries){
  const rev=[];
  for(let i=2;i<entries.length;i++){
    const p=entries[i-1].c-entries[i-2].c,c=entries[i].c-entries[i-1].c;
    if((p>0&&c<0)||(p<0&&c>0)){
      const d=new Date(entries[i].t);
      rev.push({time:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),type:c>0?'up':'down',price:entries[i].c});
    }
  }
  return rev.slice(-6);
}

function signal(sk,rsi){
  if(sk.dir==='up'&&sk.count>=4&&rsi>70)return{cls:'sig-sell',txt:'⚠ Strong sell signal — long up streak + overbought RSI'};
  if(sk.dir==='down'&&sk.count>=4&&rsi<30)return{cls:'sig-buy',txt:'⚡ Possible buy opportunity — long down streak + oversold RSI'};
  if(sk.dir==='up'&&sk.count>=3)return{cls:'sig-watch',txt:'👁 Watch closely — extended upward streak'};
  if(sk.dir==='down'&&sk.count>=3)return{cls:'sig-watch',txt:'👁 Watch closely — extended downward streak'};
  return null;
}

function destroyC(){[chartMain,chartVol,chartRSI].forEach(c=>{if(c)c.destroy();});chartMain=chartVol=chartRSI=null;}

async function loadTicker(ticker,ri){
  if(!apiKey){document.getElementById("cnt").innerHTML='<div class="stmsg">Enter your API key above.</div>';return;}
  activeRI=ri; destroyC();
  document.getElementById("cnt").innerHTML=`<div class="stmsg"><div class="spin"></div><span>Loading ${ticker}…</span></div>`;
  renderWL();

  let entries;
  try{
    entries=await fetchSeries(ticker,ri);
  }catch(e){
    document.getElementById("cnt").innerHTML=`<div class="errbox">
      <strong>⚠ Could not load ${ticker}</strong><br><br>${e.message}
    </div>`;
    return;
  }

  const cl=entries.map(e=>e.c);
  const vl=entries.map(e=>e.v);
  const ts=entries.map(e=>e.t);

  const last=entries[entries.length-1];
  const prev2=entries[entries.length-2];
  const price=last.c;
  const prev=prev2?.c??price;
  const change=price-prev;
  const changePct=(change/prev)*100;

  const sk=streak(cl);
  const rsi=calcRSI(cl);
  const lastRSI=rsi.filter(v=>v!=null).pop()||50;
  const avgVol=vl.reduce((a,b)=>a+b,0)/vl.length;
  const lastVol=last.v||0;
  const hiQ=last.h;
  const loQ=last.l;
  const revs=ri===0?reversals(entries):[];
  const sig=signal(sk,lastRSI);

  chipPcts[ticker]=changePct;
  renderWL();
  document.getElementById("upd").textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  const rng=RANGES[ri];
  const labels=ts.map(t=>{
    const d=new Date(t);
    if(rng.fmt==="time")return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    if(rng.fmt==="month")return d.toLocaleDateString([],{month:'short',year:'2-digit'});
    return d.toLocaleDateString([],{month:'short',day:'numeric'});
  });

  let rsiLbl='Neutral',rsiCls='blue';
  if(lastRSI>70){rsiLbl='Overbought';rsiCls='down';}
  else if(lastRSI<30){rsiLbl='Oversold';rsiCls='up';}

  const dotsH=sk.days.map((d,i)=>`<div class="dot ${d}${i===sk.days.length-1?' cur':''}">${d==='up'?'▲':d==='down'?'▼':'–'}</div>`).join('');
  const sigH=sig?`<div class="ssig ${sig.cls}">${sig.txt}</div>`:`<span style="font-size:12px;color:var(--dim)">No strong signal yet</span>`;
  const revH=revs.length?revs.map(r=>`<div class="ritem ${r.type}"><span class="rtime">${r.time}</span><span style="font-size:13px;color:var(--muted)">${r.type==='up'?'▲ Bounce':'▼ Reversal'}</span><span class="rprice">$${r.price.toFixed(2)}</span></div>`).join(''):'<div class="no-rev">No intraday reversals detected</div>';



  document.getElementById("cnt").innerHTML=`
    <div class="phero">
      <div class="pname">${ticker}</div>
      <div class="prow">
        <span class="pbig">$${price.toFixed(2)}</span>
        <span class="pchg ${change>=0?'up':'down'}">${change>=0?'+':''}${change.toFixed(2)} (${changePct>=0?'+':''}${Math.abs(changePct).toFixed(2)}%)</span>
      </div>
    </div>

    <div class="streak-wrap">
      <div class="slbl">Streak</div>
      <div class="shero">
        <div class="sbadge ${sk.dir}">${sk.dir==='up'?'↑':sk.dir==='down'?'↓':'–'} ${sk.count} ${sk.count===1?'day':'days'}</div>
        <div class="smeta"><strong>${sk.dir==='up'?'Rising':sk.dir==='down'?'Falling':'Flat'}</strong> ${sk.count} session${sk.count===1?'':'s'} in a row<br>${sigH}</div>
      </div>
      <div class="dots">${dotsH}</div>
    </div>

    <div class="metrics">
      <div class="mc"><div class="mlbl">RSI · 14</div><div class="mval ${rsiCls}">${lastRSI.toFixed(1)}</div><div class="msub ${rsiCls}">${rsiLbl}</div></div>
      <div class="mc"><div class="mlbl">Volume</div><div class="mval">${lastVol>=1e6?(lastVol/1e6).toFixed(2)+'M':(lastVol/1e3).toFixed(0)+'K'}</div><div class="msub ${lastVol>avgVol?'up':'down'}">${lastVol>avgVol?'Above':'Below'} avg</div></div>
      <div class="mc"><div class="mlbl">Day High</div><div class="mval">$${hiQ.toFixed(2)}</div><div class="msub neu">Today</div></div>
      <div class="mc"><div class="mlbl">Day Low</div><div class="mval">$${loQ.toFixed(2)}</div><div class="msub neu">Today</div></div>
    </div>

    ${ri===0?`<div class="rev-wrap"><div class="slbl">Intraday Reversals</div><div class="rev-list">${revH}</div></div>`:''}

    <div class="chart-wrap">
      <div class="slbl">Price chart</div>
      <div class="rtabs">${RANGES.map((r,i)=>`<span class="rtab ${i===ri?'active':''}" onclick="selR(${i})">${r.label}</span>`).join('')}</div>
      <div class="cwrap"><canvas id="cM"></canvas></div>
      <div class="cgrid">
        <div class="ccard"><div class="ctitle">Volume</div><div class="cswrap"><canvas id="cV"></canvas></div></div>
        <div class="ccard"><div class="ctitle">RSI 14 · OB&gt;70 OS&lt;30</div><div class="cswrap"><canvas id="cR"></canvas></div></div>
      </div>
    </div>
  `;

  const uC="#00d4a0",dC="#ff5c6b",bC="#6c8fff",pC=change>=0?uC:dC;
  const gOpts={color:'rgba(255,255,255,.05)',border:{display:false}};
  const tOpts={color:'#7b7a8e',font:{size:10,family:'DM Mono'}};
  const ttOpts={backgroundColor:'#1c1c26',borderColor:'rgba(255,255,255,.1)',borderWidth:1,titleColor:'#7b7a8e',bodyColor:'#f0eff8'};

  chartMain=new Chart(document.getElementById("cM"),{
    type:'line',
    data:{labels,datasets:[{data:cl,borderColor:pC,borderWidth:2,pointRadius:0,tension:0.3,fill:true,backgroundColor:change>=0?"rgba(0,212,160,.07)":"rgba(255,92,107,.07)"}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{...ttOpts,callbacks:{label:c=>`$${c.parsed.y.toFixed(2)}`}}},
      scales:{x:{ticks:{...tOpts,maxTicksLimit:7},grid:gOpts,border:{display:false}},
              y:{ticks:{...tOpts,callback:v=>'$'+v.toFixed(0)},grid:gOpts,border:{display:false}}}}
  });

  chartVol=new Chart(document.getElementById("cV"),{
    type:'bar',
    data:{labels,datasets:[{data:vl,backgroundColor:cl.map((c,i)=>i===0?uC:c>=cl[i-1]?uC:dC),borderWidth:0,borderRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{display:false},y:{ticks:{...tOpts,maxTicksLimit:3,callback:v=>v>=1e6?(v/1e6).toFixed(1)+'M':(v/1e3).toFixed(0)+'K'},grid:gOpts,border:{display:false}}}}
  });

  chartRSI=new Chart(document.getElementById("cR"),{
    type:'line',
    data:{labels,datasets:[
      {data:rsi,borderColor:bC,borderWidth:1.5,pointRadius:0,tension:0.2},
      {data:rsi.map(()=>70),borderColor:dC,borderWidth:1,borderDash:[4,3],pointRadius:0},
      {data:rsi.map(()=>30),borderColor:uC,borderWidth:1,borderDash:[4,3],pointRadius:0}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{display:false},y:{min:0,max:100,ticks:{...tOpts,stepSize:25},grid:gOpts,border:{display:false}}}}
  });
}

load(); renderWL();
if(apiKey&&activeTicker) loadTicker(activeTicker,activeRI);
</script>
